[project]
name = "parley"
version = "0.4.7"
description = "Two-way voice for terminal coding agents — hear replies read aloud, and talk back hands-free"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chris Keesey" }]
keywords = ["voice", "tts", "stt", "coding-agent", "hands-free", "accessibility"]
dependencies = []

[project.scripts]
parley = "parley.cli:main"

[project.urls]
Homepage = "https://github.com/c2keesey/parley"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parley"]
artifacts = ["src/parley/skills/**", "src/parley/sounds/**"]

[dependency-groups]
dev = ["pytest>=8"]
